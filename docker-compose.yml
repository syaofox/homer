services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: syaofox/homer:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - DOCKER_CONTAINER=true
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8080
      - MAX_CONTENT_LENGTH=16777216
      - CACHE_TTL=30
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    user: "${UID:-1000}:${GID:-1000}"